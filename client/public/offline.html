<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Offline · Stroke Recovery Academy</title>
  <style>
    html,body{margin:0;height:100%;background:#0D0D0D;color:#fff;font-family:Inter,system-ui,sans-serif}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .card{max-width:480px;border:1px solid #333;background:#1a1a1a;border-radius:12px;padding:32px}
    h1{color:#C9941A;margin:0 0 8px;font-size:24px}
    p{color:#aaa;line-height:1.5}
    a{display:inline-block;margin-top:16px;background:#C9941A;color:#000;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>You're offline</h1>
      <p>No signal right now — but courses you've already opened are still available. Your progress will sync when you're back online.</p>
      <a href="/my-learning">Open my courses</a>
    </div>
  </div>
</body>
</html>
