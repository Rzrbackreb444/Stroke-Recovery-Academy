    <!-- Structured Data — FAQ for Answer Engine Optimization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Stroke Recovery Academy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stroke Recovery Academy is an online recovery platform built by stroke survivor Nick Kremers. It provides daily routines, at-home neuroplasticity exercises, a 66-day transformation challenge, an AI recovery coach trained on Nick's methods, a survivor community, and a recovery center finder. Free to start."
          }
        },
        {
          "@type": "Question",
          "name": "Who built Stroke Recovery Academy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stroke Recovery Academy was built by Nick Kremers, who suffered a major stroke on December 3, 2018 that left him with complete one-sided paralysis. Through years of self-directed recovery work he reached 90% function and now shares the techniques — what he calls the Sasquatch Method — through this platform."
          }
        },
        {
          "@type": "Question",
          "name": "Is Stroke Recovery Academy free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can create a free account and access the daily routine system, recovery dashboard, survivor community, and core exercises at no cost. Premium features include the AI Sasquatch Coach with voice and the full 66-day transformation challenge."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Sasquatch Method?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Sasquatch Method is the daily recovery framework Nick Kremers used to recover from complete paralysis. It combines structured daily routines across four time blocks (Morning, Midday, Evening, Wind-Down), a five-level progression from Level 0 Survival to Level 4 Full Power, neuroplasticity-focused exercises, and consistent identity work — what Nick calls 'forging your beast.'"
          }
        },
        {
          "@type": "Question",
          "name": "What is the 66-Day Sasquatch Transformation Challenge?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The 66-Day Sasquatch Transformation Challenge is a structured stroke recovery program with one mission per day for 66 days. It is designed around the science that 66 days is roughly how long it takes for new behaviors to become automatic. Survivors track progress, earn streaks, and build the habits that drive long-term recovery."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Stroke Recovery Academy for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stroke Recovery Academy is for stroke survivors at any stage of recovery — from acute, just after the stroke, to years out and still working to regain function. It is also for caregivers, family members, and therapists who want a structured framework and a supportive community."
          }
        },
        {
          "@type": "Question",
          "name": "Does Stroke Recovery Academy replace physical therapy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Stroke Recovery Academy complements clinical care; it does not replace it. The platform shares one survivor's lived experience and recovery framework. Always work with your medical team and licensed therapists for diagnosis and treatment decisions."
          }
        },
        {
          "@type": "Question",
          "name": "How do I find a stroke recovery center near me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stroke Recovery Academy includes a Recovery Center Finder where you can search by ZIP code to locate stroke rehabilitation centers, neurologists, and physical therapists near you."
          }
        }
      ]
    }
    </script>
